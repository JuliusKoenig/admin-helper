[project]
name = "admin_helper"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Julius Koenig", email = "info@bastelquartier.de" },
]
dependencies = [
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "requests>=2.34.2",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "urllib3>=2.7.0",
    "wiederverwendbar>=0.12.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
admin-helper = "admin_helper.cli:cli_app"
