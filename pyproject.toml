[project]
name = "admin_helper"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Julius Koenig", email = "info@bastelquartier.de" },
]
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
]
requires-python = ">=3.12"

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"
#
#[project.scripts]
#admin-helper = "admin_helper.cli:cli_app"


[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "pyright>=1.1.411",
    "pytest",
    "pytest-cov",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
source = ["admin_helper"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
